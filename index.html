<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f3ed"><meta name="apple-mobile-web-app-capable" content="yes"><title>My Japan Wardrobe</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#292a27;background:#f7f3ed}*{box-sizing:border-box}body{margin:0;padding-bottom:95px}button,input,select{font:inherit}button{cursor:pointer}header{padding:32px 20px 18px;background:#eee7dd}h1{font-family:Georgia,serif;font-size:34px;line-height:1.05;margin:8px 0}h2{font-family:Georgia,serif;font-size:26px;margin:0 0 10px}.eyebrow{letter-spacing:2px;text-transform:uppercase;font-size:10px;font-weight:700;color:#776e62}.sub{font-size:13px;color:#726d66;line-height:1.5}.wrap{max-width:760px;margin:auto;padding:20px}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fff;border-top:1px solid #e5dfd7;padding:10px 3px calc(12px + env(safe-area-inset-bottom));z-index:5}.tabs button{border:0;background:none;font-size:11px;color:#756f67;padding:6px 3px}.tabs button.active{color:#8c533b;font-weight:800}.pill,.btn{border:1px solid #d7c9bb;border-radius:24px;padding:10px 14px;background:white;color:#3e3b36;font-size:12px}.btn.primary{background:#363d32;color:white;border-color:#363d32}.btn.danger{color:#a34141}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:#fff;border:1px solid #e9e3da;border-radius:15px;overflow:hidden}.card .body{padding:12px}.card h3{font-size:14px;margin:0 0 6px}.art{height:165px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,#ede7df,#dcd4c8);overflow:hidden}.art img{width:100%;height:100%;object-fit:cover}.garment{font-size:80px;filter:drop-shadow(0 9px 7px #0002)}.tag{display:inline-block;border-radius:12px;padding:4px 8px;font-size:10px;background:#eee9e1;margin:3px 3px 0 0}.tag.owned{background:#dce8d9}.muted{font-size:12px;color:#716e69}.stack{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.small{font-size:11px;padding:7px 10px}.panel{padding:16px;background:#fff;border:1px solid #e6ded4;border-radius:16px;margin:14px 0}.swatch{display:inline-block;width:17px;height:17px;border-radius:50%;border:1px solid #0002;vertical-align:middle;margin-right:5px}.hidden{display:none!important}label{font-size:12px;font-weight:600;display:block;margin:11px 0 4px}input,select{width:100%;padding:12px;border:1px solid #dcd3c7;border-radius:9px;background:white}input[type=file]{padding:8px}.outfit{display:flex;gap:6px;margin:10px 0}.outfit .tile{flex:1;min-width:0;text-align:center;background:#f3eee7;border-radius:10px;padding:12px 3px}.outfit .tile b{display:block;font-size:34px}.outfit .tile span{display:block;font-size:10px;overflow-wrap:anywhere}.progress{height:7px;border-radius:8px;background:#e9e2d8;overflow:hidden}.progress>div{height:100%;background:#74806b}.check{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #eee8e0}.check input{width:auto}.notice{padding:12px;background:#efe9df;border-radius:12px;font-size:12px;line-height:1.5}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.full{width:100%}a{color:#87543b}.empty{padding:25px;text-align:center;color:#756e64}footer{font-size:11px;color:#817970;padding:20px}
</style></head><body><header><div class="eyebrow">Your personal style studio · Japan 2026</div><h1>My Japan<br><i>Wardrobe.</i></h1><div class="sub">Tokyo · Osaka · Kyoto &nbsp; / &nbsp; 22 Oct – 3 Nov<br>Made for your colors, proportions and 20k-step days.</div></header><main class="wrap" id="main"></main><nav class="tabs" id="tabs"></nav><script>
const KEY='japan-wardrobe-v1';const seed=[{id:'owned-jeans',name:'Eva high-rise bootcut jeans',cat:'Bottom',color:'Dark indigo',brand:'M&S',status:'Owned',emoji:'👖',note:'Confirmed purchase. Flattering bootcut silhouette.'},{id:'rec-1',name:'Cream fitted long-sleeve top',cat:'Top',color:'Cream',brand:'Uniqlo / H&M',status:'Wishlist',emoji:'👚',note:'Tucked or semi-tucked: balances the bootcut shape.',url:'https://ae.hm.com/'},{id:'rec-2',name:'Burgundy fine-knit top',cat:'Top',color:'Burgundy',brand:'Zara',status:'Wishlist',emoji:'👚',note:'Rich autumn accent; wear with dark indigo.',url:'https://www.zara.com/ae/'},{id:'rec-3',name:'Breton striped knit',cat:'Top',color:'Navy / cream',brand:'H&M',status:'Wishlist',emoji:'👕',note:'A social-style capsule staple, not a verified creator endorsement.',url:'https://ae.hm.com/'},{id:'rec-4',name:'Black straight-leg jeans',cat:'Bottom',color:'Black',brand:'H&M',status:'Wishlist',emoji:'👖',note:'A different silhouette from your bootcut; avoid excessively wide hips.',url:'https://ae.hm.com/en/buy-straight-high-waist-jeans-denim-black'},{id:'rec-5',name:'Charcoal tailored straight trousers',cat:'Bottom',color:'Charcoal',brand:'Zara',status:'Wishlist',emoji:'👖',note:'Polished alternative for evenings.',url:'https://www.zara.com/ae/'},{id:'rec-6',name:'Chocolate cropped jacket',cat:'Layer',color:'Chocolate',brand:'Zara',status:'Wishlist',emoji:'🧥',note:'Ends near waist to define proportion.',url:'https://www.zara.com/ae/'},{id:'rec-7',name:'Lightweight taupe cardigan',cat:'Layer',color:'Taupe',brand:'Uniqlo',status:'Wishlist',emoji:'🧥',note:'Packable for trains and cooler evenings.',url:'https://www.uniqlo.com/jp/ja/'},{id:'rec-8',name:'Light rain shell',cat:'Layer',color:'Stone',brand:'Uniqlo',status:'Wishlist',emoji:'🧥',note:'More useful than heavy outerwear for October showers.',url:'https://www.uniqlo.com/jp/ja/'},{id:'rec-9',name:'Stable walking sneakers',cat:'Shoes',color:'White / grey',brand:'Adidas',status:'Wishlist',emoji:'👟',note:'Choose by fit; break in before travel.',url:'https://www.adidas.ae/en/women-shoes'},{id:'rec-10',name:'Medium crescent crossbody',cat:'Accessory',color:'Chocolate',brand:'Zara',status:'Wishlist',emoji:'👜',note:'Hands-free and roomy enough for daily essentials.',url:'https://www.zara.com/ae/'}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.items))state={items:seed,packed:[],favorites:[],tab:'Looks'};let filter='All',city='All',mode='All';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Phone storage is full. Export a backup and use smaller photos.')}}function setTab(t){state.tab=t;save();render()}const outfits=[{name:'Tokyo · city classic',city:'Tokyo',mode:'Day',parts:['owned-jeans','rec-1','rec-6','rec-9'],why:'Defined waist + dark denim + cropped outerwear.'},{name:'Tokyo · museum & coffee',city:'Tokyo',mode:'Day',parts:['rec-4','rec-3','rec-7','rec-9'],why:'Stripes, straight denim and a removable layer.'},{name:'Osaka · USJ all day',city:'Osaka',mode:'Active',parts:['rec-4','rec-1','rec-8','rec-9'],why:'Easy layers and practical shoes for long queues.'},{name:'Osaka · evening',city:'Osaka',mode:'Evening',parts:['owned-jeans','rec-2','rec-6','rec-9'],why:'Burgundy and chocolate add rich color without sacrificing comfort.'},{name:'Kyoto · temple walk',city:'Kyoto',mode:'Active',parts:['rec-5','rec-1','rec-7','rec-9'],why:'Comfortable straight trousers and layers for cooler mornings.'},{name:'Kyoto · autumn streets',city:'Kyoto',mode:'Day',parts:['owned-jeans','rec-3','rec-6','rec-9'],why:'Classic stripe and indigo combination.'},{name:'Mt Fuji · layering',city:'Tokyo',mode:'Active',parts:['rec-4','rec-1','rec-7','rec-8','rec-9'],why:'Pack extra warmth depending on mountain forecast.'}];function item(id){return state.items.find(x=>x.id===id)}function garment(x){return x.photo?`<img src="${x.photo}" alt="">`:`<span class="garment">${esc(x.emoji||'👕')}</span>`}function buttons(){return ['Looks','Wardrobe','Shop','Packing','Settings'].map(t=>`<button class="${state.tab===t?'active':''}" onclick="setTab('${t}')">${{Looks:'✦',Wardrobe:'▦',Shop:'♡',Packing:'✓',Settings:'⚙'}[t]}<br>${t}</button>`).join('')}function card(x){return `<article class="card"><div class="art">${garment(x)}</div><div class="body"><h3>${esc(x.name)}</h3><div class="muted"><span class="swatch" style="background:${color(x.color)}"></span>${esc(x.color)} · ${esc(x.brand)}</div><span class="tag ${x.status==='Owned'?'owned':''}">${x.status}</span><span class="tag">${x.cat}</span><p class="muted">${esc(x.note||'')}</p><div class="stack"><button class="btn small" onclick="toggleOwned('${x.id}')">${x.status==='Owned'?'Move to wishlist':'Mark owned'}</button><button class="btn small" onclick="editItem('${x.id}')">Edit</button>${x.url?`<a class="btn small" target="_blank" rel="noopener" href="${esc(x.url)}">Shop ↗</a>`:''}</div></div></article>`}function color(c){let s=(c||'').toLowerCase();return Object.entries({cream:'#f5ecd9',indigo:'#283d59',black:'#222',burgundy:'#702d43',chocolate:'#654536',taupe:'#a59889',charcoal:'#52565b',stone:'#c6c0b5',white:'#e8e8e3',navy:'#263954'}).find(([k])=>s.includes(k))?.[1]||'#b3aa9d'}function toggleOwned(id){let x=item(id);x.status=x.status==='Owned'?'Wishlist':'Owned';save();render()}function toggleFav(i){state.favorites=state.favorites.includes(i)?state.favorites.filter(x=>x!==i):[...state.favorites,i];save();render()}function looks(){let rows=outfits.map((o,i)=>({...o,i})).filter(o=>(city==='All'||o.city===city)&&(mode==='All'||o.mode===mode));return `<div class="eyebrow">Curated outfits</div><h2>Looks for the trip</h2><p class="sub">Outfits combine your confirmed jeans with recommended pieces. Wishlist items are not marked as purchased.</p><div class="controls"><select aria-label="City" onchange="city=this.value;render()">${['All','Tokyo','Osaka','Kyoto'].map(x=>`<option ${city===x?'selected':''}>${x}</option>`)}</select><select aria-label="Occasion" onchange="mode=this.value;render()">${['All','Day','Evening','Active'].map(x=>`<option ${mode===x?'selected':''}>${x}</option>`)}</select></div>${rows.map(o=>`<section class="panel"><div class="row"><div><span class="eyebrow">${o.city} · ${o.mode}</span><h3>${o.name}</h3></div><button class="btn small" onclick="toggleFav(${o.i})">${state.favorites.includes(o.i)?'♥ Saved':'♡ Save'}</button></div><div class="outfit">${o.parts.map(id=>{let x=item(id);return x?`<div class="tile"><b>${x.emoji||'👕'}</b><span>${esc(x.name)}</span><span style="color:#777">${x.status==='Owned'?'✓ Owned':'To buy'}</span></div>`:''}).join('')}</div><p class="muted">${o.why}</p></section>`).join('')}`}
function wardrobe(shop=false){let arr=state.items.filter(x=>shop?x.status==='Wishlist':filter==='All'||x.cat===filter);return `<div class="eyebrow">${shop?'Thoughtful additions':'Your collection'}</div><h2>${shop?'Shopping edit':'My wardrobe'}</h2><p class="sub">${shop?'Recommended styles and retailer links. Check current availability and prices online.':'Add your real purchases and photos. All edits stay on this device unless you export a backup.'}</p>${!shop?`<div class="controls">${['All','Top','Bottom','Layer','Shoes','Accessory'].map(x=>`<button class="pill" style="${filter===x?'background:#353d32;color:#fff':''}" onclick="filter='${x}';render()">${x}</button>`).join('')}</div><button class="btn primary" onclick="showForm()">+ Add clothing item</button>`:''}<div class="grid" style="margin-top:14px">${arr.map(card).join('')}</div>${!arr.length?'<div class="empty">No items here yet.</div>':''}`}
const packing=['Passport, tickets and travel documents','Dark indigo bootcut jeans','Black jeans or alternative trousers','3–4 breathable tops','2 long-sleeve tops','1–2 thin knit layers','Cropped or lightweight jacket','Compact rain shell / umbrella','Two pairs of broken-in sneakers','7–8 pairs of comfortable socks','Medium crossbody bag','Mt Fuji warm layer','Medication and essentials','Phone charger / travel adapter'];function packingPage(){let done=packing.filter(x=>state.packed.includes(x)).length;return `<div class="eyebrow">Ready to depart</div><h2>Packing list</h2><p class="sub">${done} of ${packing.length} essentials packed</p><div class="progress"><div style="width:${100*done/packing.length}%"></div></div><div class="panel">${packing.map((x,i)=>`<label class="check"><input type="checkbox" ${state.packed.includes(x)?'checked':''} onchange="pack(${i},this.checked)"><span>${x}</span></label>`).join('')}</div>`}function pack(i,v){let x=packing[i];state.packed=v?[...new Set([...state.packed,x])]:state.packed.filter(y=>y!==x);save();render()}function settings(){return `<div class="eyebrow">Personal style profile</div><h2>Designed for you</h2><div class="panel"><b>Shape</b><p class="sub">Pear-shaped · 168 cm · prefers bootcut and straight silhouettes over wide-leg jeans that draw attention to the widest part of the hip.</p><b>Palette</b><p class="sub">Dark indigo, black, cream, chocolate, burgundy, taupe and charcoal. This is a suggested coordinating palette, not a formal seasonal color analysis.</p><b>Styling rules</b><p class="sub">Defined waist, structured cropped layers, neat shoulder details, fitted/semi-fitted tops and stable walking sneakers.</p></div><div class="panel"><b>Offline & backup</b><p class="sub">Wardrobe edits and photos are saved locally in this browser. They do not automatically sync across devices. Export regularly, especially before clearing browser data.</p><div class="stack"><button class="btn primary" onclick="backup()">Export wardrobe backup</button><button class="btn" onclick="$('#restore').click()">Import backup</button><input id="restore" class="hidden" type="file" accept="application/json" onchange="restore(event)"></div></div><div class="panel"><b>Style inspiration</b><p class="sub">Editorial autumn 2026 cues: dark-wash denim, striped knits, suede-look cropped jackets, compact structured layers and sneaker styling. These are curated ideas, not verified Instagram/TikTok influencer endorsements. The app does not pull social feeds offline.</p><a href="https://www.vogue.com/article/lady-jacket-outfits" target="_blank">Vogue: cropped lady jackets ↗</a><br><a href="https://www.realsimple.com/stylist-fall-wardrobe-essentials-amazon-october-2026-12177350" target="_blank">Fall capsule essentials ↗</a></div><div class="notice">For reliable iPhone Home Screen offline access, install this app from an HTTPS website once while online. Opening a local HTML file alone does not provide the same reliable installed-app storage and offline behavior.</div>`}function showForm(id){let x=id?item(id):{name:'',cat:'Top',color:'',brand:'',status:'Owned',emoji:'👚',note:'',url:''};$('#main').innerHTML=`<div class="eyebrow">Closet editor</div><h2>${id?'Edit item':'Add purchase'}</h2><form class="panel" id="form"><label>Item name<input name="name" required value="${esc(x.name)}"></label><label>Category<select name="cat">${['Top','Bottom','Layer','Shoes','Accessory'].map(v=>`<option ${v===x.cat?'selected':''}>${v}</option>`)}</select></label><label>Color<input name="color" value="${esc(x.color)}"></label><label>Brand<input name="brand" value="${esc(x.brand)}"></label><label>Status<select name="status">${['Owned','Wishlist'].map(v=>`<option ${v===x.status?'selected':''}>${v}</option>`)}</select></label><label>Notes<input name="note" value="${esc(x.note)}"></label><label>Product link<input name="url" type="url" value="${esc(x.url||'')}"></label><label>Photo from your phone<input type="file" name="photo" accept="image/*"></label><div class="stack"><button type="submit" class="btn primary">Save item</button><button type="button" class="btn" onclick="render()">Cancel</button>${id?`<button type="button" class="btn danger" onclick="removeItem('${id}')">Delete</button>`:''}</div></form>`;$('#form').onsubmit=async e=>{e.preventDefault();let f=e.target,fd=new FormData(f);let obj={...x,id:id||'user-'+Date.now()};for(let k of ['name','cat','color','brand','status','note','url'])obj[k]=fd.get(k);obj.emoji={Top:'👚',Bottom:'👖',Layer:'🧥',Shoes:'👟',Accessory:'👜'}[obj.cat];let file=f.photo.files[0];if(file)obj.photo=await resize(file);if(id)state.items=state.items.map(y=>y.id===id?obj:y);else state.items.unshift(obj);save();state.tab='Wardrobe';render()}}function resize(file){return new Promise((resolve,reject)=>{let im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{let s=Math.min(1,650/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);resolve(c.toDataURL('image/jpeg',.68))};im.onerror=reject;im.src=u})}function editItem(id){showForm(id)}function removeItem(id){if(confirm('Delete this wardrobe item?')){state.items=state.items.filter(x=>x.id!==id);save();render()}}function backup(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-japan-wardrobe-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function restore(e){let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.items))throw Error();if(confirm('Replace current wardrobe with this backup?')){state=d;save();render()}}catch{alert('Invalid wardrobe backup file.')}}function render(){$('#tabs').innerHTML=buttons();$('#main').innerHTML=({Looks:looks,Wardrobe:()=>wardrobe(false),Shop:()=>wardrobe(true),Packing:packingPage,Settings:settings}[state.tab]||looks)()}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
